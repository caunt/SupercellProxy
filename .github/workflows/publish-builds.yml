name: Publish Builds
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]
  release:
    types: [ created ]

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-latest, rid: win-arm64 }
          - { os: windows-latest, rid: win-x86 }
          
          # macOS
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
          
          # Ubuntu (glibc)
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm }
          
          # Alpine (musl)
          - { os: ubuntu-latest, rid: linux-musl-x64, is_alpine: true }
          - { os: ubuntu-24.04-arm, rid: linux-musl-arm64, is_alpine: true }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET
        if: ${{ !matrix.is_alpine }}
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: '10'

      - name: Install Linux Prerequisites
        if: ${{ runner.os == 'Linux' && !matrix.is_alpine }}
        run: |
          sudo apt-get update
          
          if [ "${{ matrix.rid }}" = "linux-arm" ]; then
            sudo dpkg --add-architecture armhf
            sudo apt-get update
            sudo apt-get install -y clang zlib1g-dev libc6-dev:armhf libstdc++-13-dev:armhf gcc-arm-linux-gnueabihf
          else
            sudo apt-get install -y clang zlib1g-dev
          fi

      - name: Publish Application (Host)
        if: ${{ !matrix.is_alpine }}
        run: |
          dotnet publish src/SupercellProxy.Playground/SupercellProxy.Playground.csproj -c Release -r ${{ matrix.rid }} -o ./publish/proxy/${{ matrix.rid }}
          dotnet publish src/SupercellProxy.PublicKeyExtractor/SupercellProxy.PublicKeyExtractor.csproj -c Release -r ${{ matrix.rid }} -o ./publish/key-extractor/${{ matrix.rid }}

      - name: Publish Application (Alpine Container)
        if: ${{ matrix.is_alpine }}
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine \
            sh -c "apk add --no-cache clang build-base zlib-dev && \
                   dotnet publish src/SupercellProxy.Playground/SupercellProxy.Playground.csproj \
                   -c Release \
                   -r ${{ matrix.rid }} \
                   -o ./publish/proxy/${{ matrix.rid }} && \
                   dotnet publish src/SupercellProxy.PublicKeyExtractor/SupercellProxy.PublicKeyExtractor.csproj \
                   -c Release \
                   -r ${{ matrix.rid }} \
                   -o ./publish/key-extractor/${{ matrix.rid }}"

      - name: Upload Proxy Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: proxy-${{ matrix.rid }}
          path: ./publish/proxy/${{ matrix.rid }}

      - name: Upload Key Extractor Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: key-extractor-${{ matrix.rid }}
          path: ./publish/key-extractor/${{ matrix.rid }}
          
  compress_and_upload:
    name: Compress and Upload Release Archives
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ./artifacts

      - name: Compress Executables
        shell: bash
        run: |
          mkdir -p ./release-archives
          
          for project in proxy key-extractor; do
            if [ "$project" = "proxy" ]; then
              executableBaseName="SupercellProxy.Playground"
            else
              executableBaseName="SupercellProxy.PublicKeyExtractor"
            fi
            
            for rid_dir in ./artifacts/${project}-*/; do
              [ -d "$rid_dir" ] || continue
              rid=$(basename "$rid_dir" | sed "s/^${project}-//")
              
              executableFileName="$executableBaseName"
              if [[ "$rid" == *"win"* ]]; then
                executableFileName="${executableBaseName}.exe"
              fi
              
              architectureFilter="--x86"
              if [[ "$rid" == *"arm64"* ]]; then
                  architectureFilter="--arm64"
              elif [[ "$rid" == *"arm"* ]]; then
                  architectureFilter="--arm"
              fi
              
              cd "$rid_dir"
              env XZ_OPT="$architectureFilter -9e -T0" tar -cJf "../../release-archives/${project}-${rid}.tar.xz" "$executableFileName"
              cd "$OLDPWD"
            done
          done

      - name: Upload Compressed Archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compressed
          path: ./release-archives/*.tar.xz
